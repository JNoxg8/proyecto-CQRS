server:
  port: 8082

spring:
  application:
    name: servicio-consultas

  # Read model: MongoDB (docker-compose service "mongo", host port 27018).
  # authSource=admin -> the "admin" user was created in the "admin" database.
  # serverSelectionTimeoutMS=5000 -> if MongoDB is down, an operation fails after 5 s (default 30 s), so the
  # Kafka error handler can retry it with its own back-off (see config/ErroresKafkaConfig).
  data:
    mongodb:
      uri: mongodb://admin:admin@localhost:27018/tienda_consultas?authSource=admin&serverSelectionTimeoutMS=5000
      auto-index-creation: true   # creates the @Indexed indexes of the read model

  # Public keys of servicio-autenticacion: used to verify the signature of every JWT
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8083/.well-known/jwks.json

  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      auto-offset-reset: earliest   # a new consumer group starts from the first event -> it can rebuild everything
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer wraps the JSON one: a corrupt message ("poison pill") is logged and skipped
      # instead of making the consumer fail forever on the same record.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.tienda.eventos
        allow.auto.create.topics: false

tienda:
  cors-origenes: http://localhost:8080,http://127.0.0.1:8080
